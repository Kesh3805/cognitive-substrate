name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude cs-embedder-fastembed --all-targets

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: cs
          POSTGRES_PASSWORD: cs
          POSTGRES_DB: cs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cs -d cs"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CS_TEST_DATABASE_URL: postgres://cs:cs@localhost:5432/cs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude cs-embedder-fastembed

  # The ONNX embedder links a native runtime, so it is built in its own job
  # (and never by default). Its model-download test is opt-in.
  fastembed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p cs-embedder-fastembed --all-targets
      - run: cargo test -p cs-embedder-fastembed
      - run: cargo check -p cs-server --features fastembed

  docker:

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t cognitive-substrate .
