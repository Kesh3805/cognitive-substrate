# OpenSSF Scorecard: supply-chain security checks, reported to code scanning.
# Publishing results imposes restrictions on this workflow: no top-level env
# or defaults, no workflow-level write permissions, and only approved actions
# in the scorecard job (https://github.com/ossf/scorecard-action#workflow-restrictions).
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload results to code scanning.
      security-events: write
      # Publish results and enable the badge.
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
