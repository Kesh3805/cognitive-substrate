[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "cognitive-substrate"
version = "0.1.0"
description = "Python client for the Cognitive Substrate HTTP API"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Cognitive Substrate contributors" }]
keywords = ["memory", "agents", "beliefs", "recall", "causal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25,<1",
    "typing_extensions>=4.6; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.urls]
Repository = "https://github.com/Kesh3805/cognitive-substrate"
Documentation = "https://github.com/Kesh3805/cognitive-substrate/tree/main/sdks/python"

[tool.hatch.build.targets.wheel]
packages = ["src/cognitive_substrate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
