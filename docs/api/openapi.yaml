# OpenAPI 3.1 description of the Cognitive Substrate HTTP API.
# Hand-maintained: update it together with crates/cs-server/src/lib.rs.
# crates/cs-server/tests/openapi.rs checks it against the router.
openapi: 3.1.0
info:
  title: Cognitive Substrate HTTP API
  version: 0.1.0
  summary: Governed memory, beliefs, recall and causal evidence for AI agents.
  description: |-
    Machine-readable description of every route served by `cs-server` (`crates/cs-server/src/lib.rs`). The test `crates/cs-server/tests/openapi.rs` fails when a route is added to the router but not to this document, or vice versa.

    **Authentication.** Every `/v1` route except `/v1/health` and `/v1/ready` identifies the caller with the `x-cs-tenant` header (required) plus the optional `x-cs-user`, `x-cs-agent` and `x-cs-projects` headers. When the server runs with `CS_API_KEY`, those routes also require `Authorization: Bearer <key>`. Production deployments are expected to set the principal headers from a verified token in an identity-aware proxy.

    **Errors.** Every error body is `{"error": {"code": "...", "message": "..."}}`. Unknown routes return 404 `not_found`.
  license: {name: Apache-2.0, identifier: Apache-2.0}
servers:
- {url: 'http://localhost:8080', description: Default `CS_BIND`}
security:
- {tenantHeader: [], bearerAuth: []}
- {tenantHeader: []}
tags:
- name: system
  description: Liveness and readiness (no authentication).
- {name: memories, description: 'Bitemporal, revisioned memories.'}
- {name: recall, description: Policy-controlled recall and replay.}
- {name: beliefs, description: 'Evidence, beliefs and dependencies.'}
- {name: inspection, description: Event log and cognitive debt.}
- name: processing
  description: Observations, resolution proposals, jobs and embeddings.
- {name: entities, description: Entities and the knowledge graph.}
- {name: derivations, description: Compiled knowledge.}
- name: capabilities
  description: Procedural capabilities, executions and verification.
- name: information-needs
  description: Information needs and knowledge gaps.
- {name: causal, description: Causal hypotheses and interventions.}
- {name: predictions, description: Bounded predictions (experimental).}
paths:
  /v1/health:
    get:
      tags: [system]
      operationId: health
      summary: Liveness
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
  /v1/ready:
    get:
      tags: [system]
      operationId: ready
      summary: Storage readiness
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ready'}
        '503': {$ref: '#/components/responses/NotReady'}
  /v1/memories:
    parameters:
    - {$ref: '#/components/parameters/XCsUser'}
    - {$ref: '#/components/parameters/XCsAgent'}
    - {$ref: '#/components/parameters/XCsProjects'}
    post:
      tags: [memories]
      operationId: createMemory
      summary: Create a memory
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewMemory'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemoryRecord'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/StorageFailure'}
  /v1/memories/{id}:
    parameters:
    - {$ref: '#/components/parameters/XCsUser'}
    - {$ref: '#/components/parameters/XCsAgent'}
    - {$ref: '#/components/parameters/XCsProjects'}
    get:
      tags: [memories]
      operationId: getMemory
      summary: Current revision of a memory
      parameters:
      - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemoryRecord'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/StorageFailure'}
  /v1/memories/{id}/history:
    parameters:
    - {$ref: '#/components/parameters/XCsUser'}
    - {$ref: '#/components/parameters/XCsAgent'}
    - {$ref: '#/components/parameters/XCsProjects'}
    get:
      tags: [memories]
      operationId: getMemoryHistory
      summary: All revisions of a memory
      parameters:
      - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemoryHistory'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/StorageFailure'}
  /v1/memories/{id}/revisions:
    parameters:
    - {$ref: '#/components/parameters/XCsUser'}
    - {$ref: '#/components/parameters/XCsAgent'}
    - {$ref: '#/components/parameters/XCsProjects'}
    post:
      tags: [memories]
      operationId: reviseMemory
      summary: Revise a memory
      description: Supports optimistic concurrency through `expected_revision` (409 on mismatch).
      parameters:
      - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviseMemory'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemoryRecord'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/StorageFailure'}
  /v1/memories/{id}/promote:
    parameters:
    - {$ref: '#/components/parameters/XCsUser'}
    - {$ref: '#/components/parameters/XCsAgent'}
    - {$ref: '#/components/parameters/XCsProjects'}
    post:
      tags: [memories]
      operationId: promoteMemory
      summary: Validate a candidate memory
      parameters:
      - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StatusChange'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemoryRecord'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/StorageFailure'}
  /v1/memories/{id}/reject:
    parameters:
    - {$ref: '#/components/parameters/XCsUser'}
    - {$ref: '#/components/parameters/XCsAgent'}
    - {$ref: '#/components/parameters/XCsProjects'}
    post:
      tags: [memories]
      operationId: rejectMemory
      summary: Reject a candidate memory
      parameters:
      - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StatusChange'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemoryRecord'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/StorageFailure'}
  /v1/memories/{id}/tombstone:
    parameters:
    - {$ref: '#/components/parameters/XCsUser'}
    - {$ref: '#/components/parameters/XCsAgent'}
    - {$ref: '#/components/parameters/XCsProjects'}
    post:
      tags: [memories]
      operationId: tombstoneMemory
      summary: Logically delete a memory
      parameters:
      - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StatusChange'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemoryRecord'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/StorageFailure'}
  /v1/memories/{id}/purge:
    parameters:
    - {$ref: '#/components/parameters/XCsUser'}
    - {$ref: '#/components/parameters/XCsAgent'}
    - {$ref: '#/components/parameters/XCsProjects'}
    post:
      tags: [memories]
      operationId: purgeMemory
      summary: Governance hard delete of a memory
      parameters:
      - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StatusChange'}
      responses:
        '200':
          description: The `memory_purged` event
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CognitiveEvent'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/StorageFailure'}
  /v1/memories/{id}/resolve:
    parameters:
    - {$ref: '#/components/parameters/XCsUser'}
    - {$ref: '#/components/parameters/XCsAgent'}
    - {$ref: '#/components/parameters/XCsProjects'}
    post:
      tags: [memories]
      operationId: resolveMemory
      summary: Queue resolution for a memory
      parameters:
      - {$ref: '#/components/parameters/Id'}
      responses:
        '202':
          description: 'Accepted: the queued job'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/StorageFailure'}
  /v1/recall:
    parameters:
    - {$ref: '#/components/parameters/XCsUser'}
    - {$ref: '#/components/parameters/XCsAgent'}
    - {$ref: '#/components/parameters/XCsProjects'}
    post:
      tags: [recall]
      operationId: recall
      summary: Policy-controlled recall
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecallRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecallResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/StorageFailure'}
  /v1/recall-traces/{id}:
    parameters:
    - {$ref: '#/components/parameters/XCsUser'}
    - {$ref: '#/components/parameters/XCsAgent'}
    - {$ref: '#/components/parameters/XCsProjects'}
    get:
      tags: [recall]
      operationId: getRecallTrace
      summary: Inspect a recall decision
      parameters:
      - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecallTrace'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/StorageFailure'}
  /v1/recall-traces/{id}/replay:
    parameters:
    - {$ref: '#/components/parameters/XCsUser'}
    - {$ref: '#/components/parameters/XCsAgent'}
    - {$ref: '#/components/parameters/XCsProjects'}
    post:
      tags: [recall]
      operationId: replayRecall
      summary: Exact or counterfactual replay
      description: 'The body is optional: an empty body means exact replay.'
      parameters:
      - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReplayRequest'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReplayReport'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/StorageFailure'}
  /v1/evidence:
    parameters:
    - {$ref: '#/components/parameters/XCsUser'}
    - {$ref: '#/components/parameters/XCsAgent'}
    - {$ref: '#/components/parameters/XCsProjects'}
    post:
      tags: [beliefs]
      operationId: recordEvidence
      summary: Record evidence
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewEvidence'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Evidence'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/StorageFailure'}
  /v1/evidence/{id}/purge:
    parameters:
    - {$ref: '#/components/parameters/XCsUser'}
    - {$ref: '#/components/parameters/XCsAgent'}
    - {$ref: '#/components/parameters/XCsProjects'}
    post:
      tags: [beliefs]
      operationId: purgeEvidence
      summary: Governed purge of evidence (idempotent)
      parameters:
      - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Decision'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PurgeReport'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/StorageFailure'}
  /v1/beliefs:
    parameters:
    - {$ref: '#/components/parameters/XCsUser'}
    - {$ref: '#/components/parameters/XCsAgent'}
    - {$ref: '#/components/parameters/XCsProjects'}
    post:
      tags: [beliefs]
      operationId: createBelief
      summary: Create a belief
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewBelief'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Belief'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/StorageFailure'}
  /v1/beliefs/{id}:
    parameters:
    - {$ref: '#/components/parameters/XCsUser'}
    - {$ref: '#/components/parameters/XCsAgent'}
    - {$ref: '#/components/parameters/XCsProjects'}
    get:
      tags: [beliefs]
      operationId: getBelief
      summary: Belief with evidence and dependencies
      parameters:
      - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BeliefView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/StorageFailure'}
  /v1/beliefs/{id}/history:
    parameters:
    - {$ref: '#/components/parameters/XCsUser'}
    - {$ref: '#/components/parameters/XCsAgent'}
    - {$ref: '#/components/parameters/XCsProjects'}
    get:
      tags: [beliefs]
      operationId: getBeliefHistory
      summary: Every revision in the belief's lineage
      parameters:
      - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Belief'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/StorageFailure'}
  /v1/beliefs/{id}/revisions:
    parameters:
    - {$ref: '#/components/parameters/XCsUser'}
    - {$ref: '#/components/parameters/XCsAgent'}
    - {$ref: '#/components/parameters/XCsProjects'}
    post:
      tags: [beliefs]
      operationId: reviseBelief
      summary: Revise a belief
      parameters:
      - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviseBelief'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BeliefRevisionOutcome'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/StorageFailure'}
  /v1/beliefs/{id}/retract:
    parameters:
    - {$ref: '#/components/parameters/XCsUser'}
    - {$ref: '#/components/parameters/XCsAgent'}
    - {$ref: '#/components/parameters/XCsProjects'}
    post:
      tags: [beliefs]
      operationId: retractBelief
      summary: Retract a belief
      parameters:
      - {$ref: '#/components/parameters/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StatusChange'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BeliefRevisionOutcome'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/StorageFailure'}
  /v1/beliefs/{id}/resolve:
    parameters:
    - {$ref: '#/components/parameters/XCsUser'}
    - {$ref: '#/components/parameters/XCsAgent'}
    - {$ref: '#/components/parameters/XCsProjects'}
    post:
      tags: [beliefs]
      operationId: resolveBelief
      summary: Queue resolution for a belief
      parameters:
      - {$ref: '#/components/parameters/Id'}
      responses:
        '202':
          description: 'Accepted: the queued job'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/StorageFailure'}
  /v1/dependencies:
    parameters:
    - {$ref: '#/components/parameters/XCsUser'}
    - {$ref: '#/components/parameters/XCsAgent'}
    - {$ref: '#/components/parameters/XCsProjects'}
    post:
      tags: [beliefs]
      operationId: addDependency
      summary: Add or re-affirm a dependency edge
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewDependency'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BeliefDependency'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/StorageFailure'}
  /v1/events:
    parameters:
    - {$ref: '#/components/parameters/XCsUser'}
    - {$ref: '#/components/parameters/XCsAgent'}
    - {$ref: '#/components/parameters/XCsProjects'}
    get:
      tags: [inspection]
      operationId: listEvents
      summary: Cognitive event log (scope-filtered)
      parameters:
      - name: stream_id
        in: query
        required: false
        schema: {type: string, format: uuid}
      - name: event_type
        in: query
        required: false
        schema: {$ref: '#/components/schemas/CognitiveEventType'}
      - name: after_sequence
        in: query
        required: false
        schema: {type: integer, format: int64, minimum: 0}
      - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CognitiveEvent'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/StorageFailure'}
  /v1/debt:
    parameters:
    - {$ref: '#/components/parameters/XCsUser'}
    - {$ref: '#/components/parameters/XCsAgent'}
    - {$ref: '#/components/parameters/XCsProjects'}
    get:
      tags: [inspection]
      operationId: getCognitiveDebt
      summary: Cognitive Debt Index report
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CognitiveDebtReport'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/StorageFailure'}
  /v1/observations:
    parameters:
    - {$ref: '#/components/parameters/XCsUser'}
    - {$ref: '#/components/parameters/XCsAgent'}
    - {$ref: '#/components/parameters/XCsProjects'}
    post:
      tags: [processing]
      operationId: submitObservation
      summary: Store raw input and queue perception
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewObservation'}
      responses:
        '202':
          description: 'Accepted: stored; perception runs in the background'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ObservationView'}
        '400': {$ref: '#/components/responses/BadRequest'}
