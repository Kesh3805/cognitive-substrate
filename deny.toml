# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run locally with `cargo deny check`.

[graph]
# Check every target and feature, including the optional ONNX embedder.
all-features = true

[advisories]
# Vulnerabilities always fail; unmaintained and yanked crates are reported.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses compatible with distributing under Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
exceptions = [
    # Weak (file-level) copyleft, used unmodified; pulled in via dirs-sys.
    { allow = ["MPL-2.0"], crate = "option-ext" },
    # LLVM's libFuzzer runtime, combined with MIT OR Apache-2.0.
    { allow = ["NCSA"], crate = "libfuzzer-sys" },
]

[bans]
multiple-versions = "warn"
# Workspace path dependencies (`cs-core = { path = ... }`) carry no version,
# which cargo-deny counts as wildcards for publishable crates. Warn until they
# get a `version` (needed before publishing to crates.io anyway), then deny.
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
