[workspace]
resolver = "3"
members = [
    "crates/cs-core",
    "crates/cs-memory",
    "crates/cs-policy",
    "crates/cs-storage",
    "crates/cs-postgres",
    "crates/cs-engine",
    "crates/cs-server",
    "crates/cs-extractor-http",
    "crates/cs-embedder-http",
    "crates/cs-embedder-fastembed",
    "tests/conformance",
]
# The ONNX embedder pulls in a native runtime and downloads models; it is
# built on demand (and in its own CI job), never by default.
default-members = [
    "crates/cs-core",
    "crates/cs-memory",
    "crates/cs-policy",
    "crates/cs-storage",
    "crates/cs-postgres",
    "crates/cs-engine",
    "crates/cs-server",
    "crates/cs-extractor-http",
    "crates/cs-embedder-http",
    "tests/conformance",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Kesh3805/cognitive-substrate"
authors = ["Kesh3805"]

[workspace.dependencies]
cs-core = { path = "crates/cs-core" }
cs-memory = { path = "crates/cs-memory" }
cs-policy = { path = "crates/cs-policy" }
cs-storage = { path = "crates/cs-storage" }
cs-postgres = { path = "crates/cs-postgres" }
cs-engine = { path = "crates/cs-engine" }
cs-extractor-http = { path = "crates/cs-extractor-http" }
cs-embedder-http = { path = "crates/cs-embedder-http" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "json", "migrate", "macros"] }
pgvector = { version = "0.4", features = ["sqlx"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
